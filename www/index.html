<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>FamilyPlanner</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fafaf8;
        color: #7c5cfc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box {
        text-align: center;
      }
      .spinner {
        width: 32px;
        height: 32px;
        margin: 16px auto 0;
        border: 4px solid #ede4ff;
        border-top-color: #7c5cfc;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!--
      Capacitor requires a local webDir, but this app loads the live deployed
      site via server.url (see capacitor.config.ts). This file is only shown
      briefly at launch or if the remote site cannot be reached.
    -->
    <div class="box">
      <div style="font-size: 40px">🏠</div>
      <div style="margin-top: 8px; font-weight: 600">Family Planner</div>
      <div class="spinner"></div>
    </div>
  </body>
</html>
